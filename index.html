<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#10b981" />
  <title>TitipDong! - Jastip Lokal</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857', 900: '#064e3b' } },
          animation: {
            'fade-in-up': 'fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'fade-in': 'fadeIn 0.2s ease-out forwards',
            'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
            'spin-slow': 'spin 2s linear infinite',
          },
          keyframes: {
            fadeInUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            pop: { '0%': { opacity: '0', transform: 'scale(0.9)' }, '100%': { opacity: '1', transform: 'scale(1)' } }
          }
        }
      }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; background-color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; }
    #app-container { max-width: 480px; margin: 0 auto; background-color: #f8fafc; min-height: 100vh; box-shadow: 0 0 40px rgba(0,0,0,0.1); position: relative; }
    ::-webkit-scrollbar { width: 0px; background: transparent; }
    .pin-input { -webkit-text-security: disc; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // ⚙️ KONFIGURASI DATABASE & ADMIN
    // ==========================================
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxaaxuAXOzjnvc8X3dCnkIop9AzV704YwKMowfs-dn_WUxPW2kUIeLOCJhJlzzQ7h0P/exec"; 
    const PIN_ADMIN = "123555";
    // ==========================================

    const Icon = ({ name, className = "" }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (iconRef.current && window.lucide) {
          iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({ root: iconRef.current });
        }
      }, [name, className]);
      return <span ref={iconRef} className="inline-flex items-center justify-center shrink-0"></span>;
    };

    const formatRupiah = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number || 0);
    const generateId = () => `ORD-${Math.floor(Math.random() * 10000).toString().padStart(4, '0')}`;

    const App = () => {

      const urlParams = new URLSearchParams(window.location.search);
      const adminWaFromUrl = urlParams.get('admin');
      const isCustomerView = !!adminWaFromUrl;

      // --- STATES ---
      const [isAdminMode, setIsAdminMode] = useState(false);
      const [isPinModalOpen, setIsPinModalOpen] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState('');
      
      const [orders, setOrders] = useState(() => {
        const saved = localStorage.getItem('jastip_orders');
        return saved ? JSON.parse(saved) : [];
      });
      
      // Auto-save local changes (Optimistic UI Backup)
      useEffect(() => {
        if(!isCustomerView) localStorage.setItem('jastip_orders', JSON.stringify(orders));
      }, [orders, isCustomerView]);

      // --- SYNC ENGINE STATES ---
      const [syncStatus, setSyncStatus] = useState('idle'); // idle, syncing, error, offline
      const [isRefreshing, setIsRefreshing] = useState(false);
      const isSyncingRef = useRef(false);

      const [alertData, setAlertData] = useState({ isOpen: false, message: '', title: '' });
      const [confirmData, setConfirmData] = useState({ isOpen: false, message: '', onConfirm: null });

      const showAlert = (message, title = 'Informasi') => setAlertData({ isOpen: true, message, title });
      const showConfirm = (message, onConfirm) => setConfirmData({ isOpen: true, message, onConfirm });

      const [adminWaNumber, setAdminWaNumber] = useState(() => {
        if (isCustomerView) return adminWaFromUrl;
        return localStorage.getItem('jastip_admin_wa') || "";
      });
      const [isSettingOpen, setIsSettingOpen] = useState(false);
      const [tempWaNumber, setTempWaNumber] = useState(adminWaNumber);

      const [formData, setFormData] = useState({ name: '', address: '', request: '' });
      const [customerPreviewData, setCustomerPreviewData] = useState(null);

      const [isCostModalOpen, setIsCostModalOpen] = useState(false);
      const [selectedOrder, setSelectedOrder] = useState(null);
      const [costInput, setCostInput] = useState({ estimatedItemPrice: '', serviceFee: '' });
      const [adminPreviewData, setAdminPreviewData] = useState(null);


      // ==========================================
      // 🚀 BACKGROUND SYNC ENGINE
      // ==========================================
      
      const processSyncQueue = async () => {
        if (!navigator.onLine) {
          setSyncStatus('offline');
          return;
        }
        if (isSyncingRef.current || GOOGLE_SCRIPT_URL.includes("PASTE_URL")) return;
        
        let queue = JSON.parse(localStorage.getItem('jastip_sync_queue')) || [];
        if (queue.length === 0) {
          setSyncStatus('idle');
          return;
        }

        isSyncingRef.current = true;
        setSyncStatus('syncing');

        while (queue.length > 0) {
          try {
            const item = queue[0]; // PERBAIKAN: Mengambil urutan pertama dari antrean
            await fetch(GOOGLE_SCRIPT_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(item.payload),
              keepalive: true // Memastikan request tetap jalan walau tab browser mati (beralih ke WA)
            });
            // Hapus dari antrean jika sukses
            queue.shift();
            localStorage.setItem('jastip_sync_queue', JSON.stringify(queue));
          } catch (e) {
            setSyncStatus('error');
            isSyncingRef.current = false;
            return; // Berhenti jika error, coba lagi nanti
          }
        }
        
        setSyncStatus('idle');
        isSyncingRef.current = false;
      };

      const enqueueSync = (payload) => {
        const queue = JSON.parse(localStorage.getItem('jastip_sync_queue')) || [];
        queue.push({ id: Date.now(), payload });
        localStorage.setItem('jastip_sync_queue', JSON.stringify(queue));
        processSyncQueue(); // Trigger sync di background
      };

      // Listener deteksi sinyal balik
      useEffect(() => {
        window.addEventListener('online', processSyncQueue);
        window.addEventListener('offline', () => setSyncStatus('offline'));
        return () => {
          window.removeEventListener('online', processSyncQueue);
          window.removeEventListener('offline', () => setSyncStatus('offline'));
        };
      }, []);

      // Ambil data (Admin)
      const fetchOrders = async () => {
        if (GOOGLE_SCRIPT_URL.includes("PASTE_URL") || !navigator.onLine) return;
        setIsRefreshing(true);
        try {
          const res = await fetch(GOOGLE_SCRIPT_URL);
          const data = await res.json();
          // Merge logic sederhana (Prioritaskan server)
          setOrders(data);
        } catch (error) {
          console.log("Silently failed fetching updates.");
        }
        setIsRefreshing(false);
      };

      useEffect(() => {
        if (isAdminMode) {
           fetchOrders();
           processSyncQueue(); // Jalankan antrean tertunda saat buka admin
        }
      }, [isAdminMode]);


      // ==========================================
      // ALUR PELANGGAN
      // ==========================================
      
      const handleCustomerPreview = (e) => {
        e.preventDefault();
        if (GOOGLE_SCRIPT_URL.includes("PASTE_URL")) return showAlert("Aplikasi belum di-setup oleh admin.", "Error Sistem");
        if (!adminWaNumber) return showAlert("Error: Link toko tidak valid.", "Error Sistem");
        if (!formData.name || !formData.address || !formData.request) return;

        setCustomerPreviewData({ id: generateId(), ...formData });
      };

      const submitCustomerOrder = () => {
        const newOrder = {
          id: customerPreviewData.id,
          customerName: customerPreviewData.name,
          address: customerPreviewData.address,
          request: customerPreviewData.request,
          status: "MENUNGGU",
          estimatedItemPrice: 0,
          serviceFee: 0,
          date: new Date().toLocaleDateString('id-ID')
        };

        // 1. Masukkan ke Antrean Sync (Background)
        enqueueSync({ action: 'create', ...newOrder });

        // 2. Siapkan Pesan
        let message = `*PESANAN BARU - TITIP DONG!* 🛵💨\n\n`;
        message += `*ID:* ${newOrder.id}\n`;
        message += `*Nama:* ${newOrder.customerName}\n`;
        message += `*Alamat:* ${newOrder.address}\n\n`;
        message += `*🛍️ PESANAN:*\n${newOrder.request}\n\n`;
        message += `Mohon info estimasi biayanya ya min.`;

        // 3. Reset UI (Instant)
        setFormData({ name: '', address: '', request: '' });
        setCustomerPreviewData(null);
        
        // 4. PERBAIKAN: Beri jeda 300 milidetik agar pengiriman ke Database tereksekusi aman sebelum pindah ke WA
        setTimeout(() => {
          window.location.href = `https://wa.me/${adminWaNumber}?text=${encodeURIComponent(message)}`;
        }, 300);
      };


      // ==========================================
      // ALUR ADMIN
      // ==========================================
      
      const handleToggleMode = () => {
        if (isAdminMode) setIsAdminMode(false);
        else { setPinInput(''); setPinError(''); setIsPinModalOpen(true); }
      };

      const handlePinSubmit = (e) => {
        e.preventDefault();
        if (pinInput === PIN_ADMIN) {
          setIsPinModalOpen(false);
          setPinInput('');
          setPinError('');
          if (!adminWaNumber) {
             setTempWaNumber('');
             setIsSettingOpen(true);
          } else {
             setIsAdminMode(true);
          }
        } else {
          setPinError("PIN yang Anda masukkan salah.");
          setPinInput('');
        }
      };

      const handleSaveWaNumber = (e) => {
        e.preventDefault();
        let cleanedNumber = tempWaNumber.replace(/[^0-9]/g, '');
        if (cleanedNumber.startsWith('0')) cleanedNumber = '62' + cleanedNumber.substring(1);
        if (cleanedNumber.length < 10) return showAlert('Nomor WA tidak valid!', 'Peringatan');

        setAdminWaNumber(cleanedNumber);
        localStorage.setItem('jastip_admin_wa', cleanedNumber);
        setIsSettingOpen(false);
        setIsAdminMode(true);
        showAlert("Nomor WA berhasil disimpan.", "Berhasil");
      };

      const copyToClipboard = () => {
        const link = `https://${window.location.hostname}/?admin=${adminWaNumber}`;
        const textArea = document.createElement("textarea");
        textArea.value = link;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showAlert("Link Toko berhasil disalin! Bagikan ke Bio Instagram atau WhatsApp pelanggan.", "Berhasil Disalin");
        } catch (err) {
          showAlert("Gagal menyalin link.");
        }
        document.body.removeChild(textArea);
      };

      const openCostModal = (order) => {
        setSelectedOrder(order);
        setCostInput({ estimatedItemPrice: order.estimatedItemPrice || '', serviceFee: order.serviceFee || '' });
        setIsCostModalOpen(true);
      };

      const handleAdminPreview = (e) => {
        e.preventDefault();
        if (!selectedOrder) return;

        const estPrice = parseInt(costInput.estimatedItemPrice) || 0;
        const srvFee = parseInt(costInput.serviceFee) || 0;
        const totalTagihan = estPrice + srvFee;

        let notaMsg = `*NOTA TAGIHAN - TITIP DONG!* 🧾\n\n`;
        notaMsg += `Halo kak *${selectedOrder.customerName}*,\n`;
        notaMsg += `Pesanan kakak (*${selectedOrder.id}*) sedang diproses.\n\n`;
        notaMsg += `*RINCIAN BIAYA:*\n`;
        notaMsg += `Harga Barang : ${formatRupiah(estPrice)}\n`;
        notaMsg += `Ongkir & Jastip : ${formatRupiah(srvFee)}\n`;
        notaMsg += `*TOTAL TAGIHAN : ${formatRupiah(totalTagihan)}*\n\n`;
        notaMsg += `Mohon balas *OKE* jika setuju agar kurir langsung jalan! 🛵💨`;

        setAdminPreviewData({
          order: selectedOrder, estPrice, srvFee, totalTagihan, notaMsg
        });

        setIsCostModalOpen(false);
      };

      const submitAdminNota = () => {
        if (!adminPreviewData) return;

        // 1. Optimistic UI Update (Langsung ganti di layar Admin)
        setOrders(orders.map(order => 
          order.id === adminPreviewData.order.id 
            ? { ...order, estimatedItemPrice: adminPreviewData.estPrice, serviceFee: adminPreviewData.srvFee, status: "DIPROSES" } 
            : order
        ));

        // 2. Masukkan ke Antrean Sync
        enqueueSync({ 
          action: 'update', 
          id: adminPreviewData.order.id,
          status: "DIPROSES",
          estimatedItemPrice: adminPreviewData.estPrice,
          serviceFee: adminPreviewData.srvFee
        });
        
        // 3. Reset Modal & Redirect (Instant)
        const notaUrl = `https://wa.me/?text=${encodeURIComponent(adminPreviewData.notaMsg)}`;
        setAdminPreviewData(null);
        setSelectedOrder(null);
        
        // PERBAIKAN: Jeda aman untuk Admin sebelum pindah ke fitur Send To WA
        setTimeout(() => {
          window.location.href = notaUrl;
        }, 300);
      };

      const handleCompleteOrder = (id) => {
        // Optimistic UI Update
        setOrders(orders.map(o => o.id === id ? { ...o, status: "SELESAI" } : o));
        enqueueSync({ action: 'update', id: id, status: "SELESAI" });
      };

      const handleDeleteOrder = (id) => {
        showConfirm("Hapus pesanan ini secara permanen dari Database?", () => {
          // Optimistic UI Update
          setOrders(orders.filter(o => o.id !== id));
          enqueueSync({ action: 'delete', id: id });
        });
      };

      const pesananSelesai = orders.filter(o => o.status === "SELESAI");
      const totalPendapatan = pesananSelesai.reduce((sum, o) => sum + (parseInt(o.serviceFee)||0), 0);
      const totalPesananAktif = orders.filter(o => o.status !== "SELESAI").length;


      // ==========================================
      // UI RENDER
      // ==========================================
      return (
        <div id="app-container" className="flex flex-col relative overflow-x-hidden text-slate-800">

          {/* HEADER */}
          <header className="bg-gradient-to-r from-brand-600 to-brand-500 text-white shadow-lg sticky top-0 z-30">
            <div className="px-6 py-4 flex justify-between items-center">
              <div className="flex items-center gap-2.5">
                <div className="bg-white/20 p-1.5 rounded-xl backdrop-blur-md">
                  <Icon name="shopping-bag" className="w-5 h-5 text-white" />
                </div>
                <h1 className="text-xl font-extrabold tracking-tight">TitipDong</h1>
                
                {/* Indikator Background Sync */}
                {(!isCustomerView || isCustomerView) && (
                  <div className="ml-1 opacity-80" title="Status Sinkronisasi">
                    {syncStatus === 'syncing' && <Icon name="refresh-cw" className="w-3.5 h-3.5 animate-spin-slow" />}
                    {syncStatus === 'offline' && <Icon name="wifi-off" className="w-3.5 h-3.5 text-amber-300" />}
                    {syncStatus === 'error' && <Icon name="alert-circle" className="w-3.5 h-3.5 text-red-300" />}
                    {/* Jika idle, tidak tampil icon apa2 agar bersih */}
                  </div>
                )}
              </div>
              
              {!isCustomerView && (
                <button onClick={handleToggleMode} className="p-2.5 bg-white/10 hover:bg-white/20 rounded-full transition shadow-inner backdrop-blur-md">
                  <Icon name={isAdminMode ? "log-out" : "user"} className="w-4 h-4"/>
                </button>
              )}
            </div>
          </header>

          <main className="flex-1 pb-24">
            
            {isCustomerView ? (
              // ==========================================
              // TAMPILAN PELANGGAN
              // ==========================================
              <div className="animate-fade-in-up">
                
                <div className="bg-brand-600 pb-10 pt-4 px-6 rounded-b-[2rem] shadow-md relative overflow-hidden">
                  <div className="absolute right-[-10%] top-[-10%] opacity-10"><Icon name="shopping-cart" className="w-48 h-48" /></div>
                  <h2 className="text-3xl font-black text-white leading-tight mb-2 relative z-10">Pesan<br/>Jastip Sekarang.</h2>
                  <p className="text-brand-100 text-sm relative z-10 w-4/5">Tulis pesanan Anda, biar kurir kami yang belikan dan antar ke rumah!</p>
                </div>

                <div className="px-5 -mt-6 relative z-20">
                  <form onSubmit={handleCustomerPreview} className="bg-white p-6 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 space-y-5">
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400 mb-1.5 uppercase tracking-widest pl-1">Nama Pemesan</label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><Icon name="user" className="w-4 h-4 text-brand-500" /></div>
                        <input required type="text" placeholder="Cth: Budi Santoso" 
                          className="w-full bg-slate-50 border border-slate-200 pl-11 pr-4 py-3.5 rounded-2xl focus:ring-2 focus:ring-brand-500 focus:bg-white outline-none font-semibold text-sm transition-all placeholder:text-slate-400" 
                          value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} />
                      </div>
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400 mb-1.5 uppercase tracking-widest pl-1">Alamat Pengantaran</label>
                      <div className="relative">
                        <div className="absolute top-4 left-0 pl-4 flex items-center pointer-events-none"><Icon name="map-pin" className="w-4 h-4 text-brand-500" /></div>
                        <textarea required rows="2" placeholder="Detail alamat, RT/RW, patokan..." 
                          className="w-full bg-slate-50 border border-slate-200 pl-11 pr-4 py-3.5 rounded-2xl focus:ring-2 focus:ring-brand-500 focus:bg-white outline-none font-semibold text-sm transition-all resize-none placeholder:text-slate-400" 
                          value={formData.address} onChange={(e) => setFormData({...formData, address: e.target.value})}></textarea>
                      </div>
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-400 mb-1.5 uppercase tracking-widest pl-1">Daftar Titipan</label>
                      <div className="relative">
                        <div className="absolute top-4 left-0 pl-4 flex items-center pointer-events-none"><Icon name="clipboard-list" className="w-4 h-4 text-brand-500" /></div>
                        <textarea required rows="3" placeholder="1. Nasi Padang ayam bakar&#10;2. Es teh manis" 
                          className="w-full bg-slate-50 border border-slate-200 pl-11 pr-4 py-3.5 rounded-2xl focus:ring-2 focus:ring-brand-500 focus:bg-white outline-none font-semibold text-sm transition-all resize-none placeholder:text-slate-400" 
                          value={formData.request} onChange={(e) => setFormData({...formData, request: e.target.value})}></textarea>
                      </div>
                    </div>
                    
                    <div className="pt-2">
                      <button type="submit" 
                        className="w-full bg-gradient-to-r from-brand-600 to-brand-500 text-white py-4 rounded-2xl font-bold flex justify-center items-center gap-2 hover:from-brand-700 hover:to-brand-600 transition shadow-[0_8px_20px_rgb(16,185,129,0.3)] text-base active:scale-95">
                        Lanjut Preview <Icon name="arrow-right" className="w-4 h-4" />
                      </button>
                    </div>
                  </form>
                  <div className="text-center mt-6 flex justify-center items-center gap-1.5 text-xs font-semibold text-slate-400">
                    <Icon name="shield-check" className="w-4 h-4"/> Transaksi Aman, Bayar Saat Barang Tiba.
                  </div>
                </div>
              </div>

            ) : !isAdminMode ? (
              // HOMEPAGE ADMIN (BELUM LOGIN)
              <div className="animate-fade-in-up text-center mt-12 px-6">
                <div className="w-24 h-24 bg-brand-50 text-brand-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner border border-brand-100">
                   <Icon name="package-check" className="w-12 h-12"/>
                </div>
                <h2 className="text-2xl font-black text-slate-800 mb-2">Portal Admin Jastip</h2>
                <p className="text-sm text-slate-500 mb-8 leading-relaxed">Aplikasi ini adalah dashboard operasional khusus kurir/admin. Silakan masuk untuk mengelola pesanan.</p>
                <button onClick={() => { setPinInput(''); setPinError(''); setIsPinModalOpen(true); }} className="px-8 py-3.5 bg-slate-800 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition">
                  Login Admin
                </button>
              </div>

            ) : (
              // ==========================================
              // TAMPILAN ADMIN (DASHBOARD)
              // ==========================================
              <div className="animate-fade-in-up px-5 pt-2">
                
                {/* Panel Link Toko */}
                <div className="bg-slate-800 text-white rounded-3xl p-5 mb-6 shadow-xl relative overflow-hidden">
                  <div className="absolute right-0 top-0 opacity-10 scale-150 transform translate-x-4 -translate-y-4">
                    <Icon name="share-2" className="w-32 h-32" />
                  </div>
                  <div className="flex justify-between items-start mb-1">
                    <h3 className="font-bold text-xs text-slate-300 uppercase tracking-wider relative z-10">Link Toko Jastip Anda</h3>
                    <button onClick={() => { setTempWaNumber(adminWaNumber); setIsSettingOpen(true); }} 
                      className="p-2 bg-slate-700 hover:bg-slate-600 rounded-xl transition relative z-10 shadow-sm" title="Ubah Nomor WA">
                      <Icon name="edit-3" className="w-3.5 h-3.5 text-brand-300"/>
                    </button>
                  </div>
                  
                  <div className="bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/50 mt-2 mb-4 overflow-hidden text-ellipsis whitespace-nowrap text-xs font-mono text-brand-300 relative z-10 shadow-inner">
                    {`https://${window.location.hostname}/?admin=${adminWaNumber}`}
                  </div>
                  <button onClick={copyToClipboard} className="w-full py-3 bg-brand-500 hover:bg-brand-600 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition relative z-10">
                    <Icon name="copy" className="w-4 h-4"/> Salin & Bagikan
                  </button>
                </div>

                {/* Dashboard Stats */}
                <div className="grid grid-cols-2 gap-4 mb-6">
                  <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex flex-col justify-center">
                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Omset Selesai</p>
                    <h3 className="text-2xl font-black text-brand-600">{formatRupiah(totalPendapatan)}</h3>
                  </div>
                  <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex flex-col justify-center">
                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Status Order</p>
                    <div className="flex items-baseline gap-1.5">
                      <span className="text-2xl font-black text-slate-800">{totalPesananAktif}</span><span className="text-[10px] text-slate-500 font-bold">Aktif</span>
                      <span className="text-slate-300 mx-0.5">•</span>
                      <span className="text-xl font-black text-slate-400">{pesananSelesai.length}</span><span className="text-[10px] text-slate-400 font-bold">Done</span>
                    </div>
                  </div>
                </div>

                <div className="flex justify-between items-center mb-4 px-1">
                  <h3 className="font-bold text-slate-800 flex items-center gap-2"><Icon name="database" className="w-5 h-5 text-brand-500"/> Data Pesanan</h3>
                  <button onClick={fetchOrders} className="text-xs bg-brand-50 text-brand-600 px-3 py-1.5 rounded-lg font-bold border border-brand-100 active:bg-brand-100 flex items-center gap-1.5 shadow-sm transition">
                    <Icon name={isRefreshing ? "loader-2" : "refresh-cw"} className={`w-3.5 h-3.5 ${isRefreshing ? 'animate-spin-slow' : ''}`}/> Perbarui
                  </button>
                </div>

                <div className="space-y-4">
                  {orders.map((order) => (
                    <div key={order.id} className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                      <div className="px-5 py-3 border-b flex justify-between items-center bg-slate-50/50">
                        <span className={`text-[10px] font-bold px-2.5 py-1 rounded-md uppercase tracking-wider ${order.status === 'MENUNGGU' ? 'bg-amber-100 text-amber-700' : order.status === 'DIPROSES' ? 'bg-brand-100 text-brand-700' : 'bg-slate-100 text-slate-500'}`}>
                          {order.status}
                        </span>
                        <span className="text-[10px] font-mono font-medium text-slate-400">{order.date}</span>
                      </div>
                      
                      <div className="p-5">
                        <h3 className="font-bold text-slate-800 text-lg mb-1">{order.customerName}</h3>
                        <p className="text-xs font-semibold text-slate-500 mb-4 flex items-start gap-1"><Icon name="map-pin" className="w-3.5 h-3.5 shrink-0 mt-0.5 text-brand-500" />{order.address}</p>
                        
                        <div className="bg-slate-50 border border-slate-100 p-4 rounded-2xl text-sm font-medium text-slate-700 whitespace-pre-wrap leading-relaxed shadow-inner">
                          {order.request}
                        </div>
                        
                        {(order.status === 'DIPROSES' || order.status === 'SELESAI') && (
                          <div className="mt-4 pt-4 border-t border-dashed border-slate-200 space-y-1.5">
                             <div className="flex justify-between text-xs font-semibold text-slate-500">
                                <span>Estimasi Barang</span><span>{formatRupiah(order.estimatedItemPrice)}</span>
                             </div>
                             <div className="flex justify-between text-xs font-bold text-brand-600">
                                <span>Ongkir + Jastip</span><span>{formatRupiah(order.serviceFee)}</span>
                             </div>
                          </div>
                        )}
                      </div>

                      <div className="p-3 bg-slate-50/80 border-t flex gap-2">
                        {order.status === 'MENUNGGU' && (
                          <button onClick={() => openCostModal(order)} className="flex-1 bg-brand-600 text-white py-3 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-brand-700 transition">
                            <Icon name="calculator" className="w-4 h-4"/> Input Harga & Nota
                          </button>
                        )}
                        {order.status === 'DIPROSES' && (
                          <button onClick={() => handleCompleteOrder(order.id)} className="flex-1 bg-slate-800 text-white py-3 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-slate-900 transition shadow-md">
                            <Icon name="check-circle" className="w-4 h-4"/> Tandai Selesai
                          </button>
                        )}
                        <button onClick={() => handleDeleteOrder(order.id)} className="w-12 bg-white text-slate-400 hover:text-red-500 hover:bg-red-50 border rounded-xl flex items-center justify-center transition" title="Hapus">
                          <Icon name="trash-2" className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                  ))}
                  {orders.length === 0 && (
                    <div className="text-center py-16">
                      <div className="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-4 border text-slate-300 shadow-sm"><Icon name="inbox" className="w-10 h-10" /></div>
                      <p className="text-sm font-bold text-slate-500 mb-1">Database Kosong.</p>
                      <p className="text-xs text-slate-400">Pesanan dari pelanggan akan muncul di sini.</p>
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* ==========================================
              MODAL PREVIEW PELANGGAN
          ========================================== */}
          {customerPreviewData && (
            <div className="fixed inset-0 z- flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm animate-fade-in p-0 sm:p-5">
              <div className="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full max-w-sm p-6 pb-8 sm:pb-6 animate-fade-in-up">
                <div className="flex items-center justify-center w-14 h-14 bg-brand-50 text-brand-600 rounded-full mx-auto mb-4 border border-brand-100">
                  <Icon name="file-check-2" className="w-7 h-7"/>
                </div>
                <h3 className="font-bold text-center text-xl text-slate-800 mb-1">Preview Pesanan</h3>
                <p className="text-xs text-center font-medium text-slate-500 mb-6">Pastikan pesanan Anda sudah benar.</p>
                
                <div className="bg-slate-50 border border-slate-100 rounded-2xl p-5 mb-6 space-y-4 shadow-inner">
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Nama Pemesan</span>
                    <p className="text-sm font-bold text-slate-800 mt-0.5">{customerPreviewData.name}</p>
                  </div>
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Alamat Pengantaran</span>
                    <p className="text-xs font-semibold text-slate-600 leading-snug mt-0.5">{customerPreviewData.address}</p>
                  </div>
                  <div className="pt-4 border-t border-slate-200">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Daftar Titipan</span>
                    <p className="text-sm text-slate-700 whitespace-pre-wrap mt-1.5 font-medium leading-relaxed">{customerPreviewData.request}</p>
                  </div>
                </div>

                <div className="flex gap-2">
                  <button onClick={() => setCustomerPreviewData(null)} className="flex-[0.8] py-3.5 bg-slate-100 text-slate-600 font-bold rounded-2xl active:bg-slate-200 transition">Batal</button>
                  <button onClick={submitCustomerOrder} className="flex-[1.2] py-3.5 bg-brand-600 text-white font-bold rounded-2xl flex justify-center items-center gap-2 active:scale-95 transition shadow-md shadow-brand-500/30">
                    Kirim ke WA <Icon name="send" className="w-4 h-4"/>
                  </button>
                </div>
              </div>
            </div>
          )}


          {/* ==========================================
              MODAL PREVIEW NOTA ADMIN
          ========================================== */}
          {adminPreviewData && (
            <div className="fixed inset-0 z- flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm animate-fade-in p-0 sm:p-5">
              <div className="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full max-w-sm p-6 pb-8 sm:pb-6 animate-fade-in-up border-t-8 border-brand-500 relative">
                <div className="absolute top-0 right-6 w-8 h-10 bg-brand-500 shadow-sm rounded-b flex items-end justify-center pb-2">
                  <Icon name="receipt" className="w-4 h-4 text-white"/>
                </div>
                
                <h3 className="font-bold text-xl text-slate-800 mt-2 mb-1">Preview Nota</h3>
                <p className="text-xs font-medium text-slate-500 mb-5">Untuk: {adminPreviewData.order.customerName}</p>

                <div className="bg-brand-50/50 border border-brand-100 rounded-2xl p-5 mb-6">
                  <div className="space-y-3 text-sm">
                    <div className="flex justify-between text-slate-600 font-medium">
                      <span>Harga Barang</span><span>{formatRupiah(adminPreviewData.estPrice)}</span>
                    </div>
                    <div className="flex justify-between text-slate-600 font-medium">
                      <span>Ongkir & Jastip</span><span>{formatRupiah(adminPreviewData.srvFee)}</span>
                    </div>
                  </div>
                  <div className="mt-4 pt-4 border-t border-brand-200 border-dashed flex justify-between items-center">
                    <span className="text-[11px] font-bold text-slate-500 uppercase tracking-widest">Total Tagihan</span>
                    <span className="font-black text-2xl text-brand-600">{formatRupiah(adminPreviewData.totalTagihan)}</span>
                  </div>
                </div>

                <div className="flex gap-2">
                  <button onClick={() => { setAdminPreviewData(null); setIsCostModalOpen(true); }} className="flex-[0.8] py-3.5 bg-slate-100 text-slate-600 font-bold rounded-2xl active:bg-slate-200 transition">Kembali</button>
                  <button onClick={submitAdminNota} className="flex-[1.2] py-3.5 bg-brand-600 text-white font-bold rounded-2xl flex justify-center items-center gap-2 active:scale-95 transition shadow-lg shadow-brand-500/30">
                    Kirim WA <Icon name="share" className="w-4 h-4"/>
                  </button>
                </div>
                <p className="text-[10px] font-medium text-center text-slate-400 mt-3 px-4">Tindakan ini akan mengupdate status & membuka fitur Send To WhatsApp.</p>
              </div>
            </div>
          )}


          {/* ==========================================
              MODALS LAINNYA
          ========================================== */}
          
          {/* Custom Alert */}
          {alertData.isOpen && (
            <div className="fixed inset-0 z- flex items-center justify-center p-5 bg-slate-900/50 backdrop-blur-sm animate-fade-in">
              <div className="bg-white rounded-3xl w-full max-w-xs p-6 shadow-2xl animate-pop text-center border-t-4 border-brand-500">
                <h3 className="font-bold text-lg text-slate-800 mb-2">{alertData.title}</h3>
                <p className="text-sm font-medium text-slate-500 mb-6 leading-relaxed">{alertData.message}</p>
                <button onClick={() => setAlertData({...alertData, isOpen: false})} className="w-full py-3.5 bg-brand-600 text-white font-bold rounded-2xl active:bg-brand-700 shadow-md">Mengerti</button>
              </div>
            </div>
          )}

          {/* Custom Confirm */}
          {confirmData.isOpen && (
            <div className="fixed inset-0 z- flex items-center justify-center p-5 bg-slate-900/50 backdrop-blur-sm animate-fade-in">
              <div className="bg-white rounded-3xl w-full max-w-xs p-6 shadow-2xl animate-pop text-center border-t-4 border-red-500">
                <div className="w-12 h-12 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-3 border border-red-100"><Icon name="alert-triangle" className="w-6 h-6"/></div>
                <h3 className="font-bold text-lg text-slate-800 mb-2">Konfirmasi</h3>
                <p className="text-sm font-medium text-slate-500 mb-6 leading-relaxed">{confirmData.message}</p>
                <div className="flex gap-2">
                  <button onClick={() => setConfirmData({...confirmData, isOpen: false})} className="flex-1 py-3.5 bg-slate-100 text-slate-600 font-bold rounded-2xl">Batal</button>
                  <button onClick={() => { confirmData.onConfirm(); setConfirmData({...confirmData, isOpen: false}); }} className="flex-1 py-3.5 bg-red-500 text-white font-bold rounded-2xl shadow-md">Ya, Lanjutkan</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal PIN Admin */}
          {isPinModalOpen && (
            <div className="fixed inset-0 z- flex items-center justify-center p-5 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-xs p-6 animate-pop relative">
                <button onClick={() => setIsPinModalOpen(false)} className="absolute right-4 top-4 text-slate-400 hover:bg-slate-100 p-1 rounded-full transition"><Icon name="x" className="w-5 h-5"/></button>
                <div className="w-14 h-14 bg-slate-50 border border-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner"><Icon name="lock" className="w-6 h-6"/></div>
                <h3 className="font-bold text-center text-xl mb-1 text-slate-800">Akses Admin</h3>
                <p className="text-xs font-medium text-center text-slate-400 mb-6">Masukkan PIN Keamanan</p>
                
                <form onSubmit={handlePinSubmit}>
                  <input 
                    type="password" 
                    inputMode="numeric" 
                    pattern="[0-9]*" 
                    autoFocus 
                    maxLength={6} 
                    placeholder="••••••" 
                    className="pin-input w-full text-center tracking-[0.5em] text-3xl font-black bg-slate-50 border border-slate-200 px-4 py-3 rounded-2xl mb-2 focus:ring-2 focus:ring-brand-500 outline-none transition-all placeholder:text-2xl placeholder:tracking-widest placeholder:align-middle" 
                    value={pinInput} 
                    onChange={(e) => setPinInput(e.target.value.replace(/[^0-9]/g, ''))} 
                  />
                  {pinError && <p className="text-red-500 text-[11px] font-bold text-center mb-2">{pinError}</p>}
                  
                  <button type="submit" className="w-full mt-3 py-4 bg-slate-800 text-white rounded-2xl font-bold active:scale-95 transition shadow-lg">Masuk Dashboard</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Setup WA Admin */}
          {isSettingOpen && (
            <div className="fixed inset-0 z- flex items-end sm:items-center justify-center bg-slate-900/80 backdrop-blur-sm animate-fade-in p-0 sm:p-5">
              <div className="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden p-6 pb-10 sm:pb-6 animate-fade-in-up">
                <h3 className="font-bold text-xl text-slate-800 mb-1">Pengaturan Toko</h3>
                <p className="text-xs font-medium text-slate-500 mb-6">Silakan atur nomor WhatsApp Anda. Link Toko akan dibuat berdasarkan nomor ini.</p>
                <form onSubmit={handleSaveWaNumber}>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-400 mb-1.5 uppercase tracking-widest pl-1">Nomor WhatsApp Admin</label>
                    <div className="relative mb-6">
                      <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold"><Icon name="phone" className="w-5 h-5"/></span>
                      <input type="tel" placeholder="Contoh: 08123456789" required
                        className="w-full bg-slate-50 border border-slate-200 pl-12 pr-4 py-3.5 rounded-2xl focus:ring-2 focus:ring-brand-500 focus:bg-white outline-none font-bold tracking-wide transition-all"
                        value={tempWaNumber} onChange={(e) => setTempWaNumber(e.target.value)} />
                    </div>
                  </div>
                  <div className="flex gap-2">
                    {adminWaNumber && <button type="button" onClick={() => setIsSettingOpen(false)} className="flex-1 py-3.5 bg-slate-100 text-slate-600 font-bold rounded-2xl active:bg-slate-200">Batal</button>}
                    <button type="submit" className="flex- py-3.5 bg-brand-600 text-white font-bold rounded-2xl shadow-md shadow-brand-500/30 active:scale-95 transition">Simpan & Selesai</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Input Biaya (Admin) - Sebelum Preview */}
          {isCostModalOpen && (
            <div className="fixed inset-0 z- flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm animate-fade-in p-0 sm:p-5">
              <div className="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full max-w-sm p-6 pb-10 sm:pb-6 animate-fade-in-up border-t-8 border-slate-800">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="font-bold text-xl text-slate-800">Input Tagihan</h3>
                  <button onClick={() => setIsCostModalOpen(false)} className="bg-slate-100 hover:bg-slate-200 text-slate-500 p-1.5 rounded-full transition"><Icon name="x" className="w-4 h-4"/></button>
                </div>
                <form onSubmit={handleAdminPreview} className="space-y-4">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-400 mb-1.5 uppercase tracking-widest pl-1">Harga Barang (Estimasi)</label>
                    <div className="relative">
                      <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold">Rp</span>
                      <input required type="number" min="0" placeholder="0" 
                        className="w-full bg-slate-50 border border-slate-200 pl-12 pr-4 py-3.5 rounded-2xl font-black text-lg outline-none focus:ring-2 focus:ring-slate-800 transition-all placeholder:font-medium" 
                        value={costInput.estimatedItemPrice} onChange={(e) => setCostInput({...costInput, estimatedItemPrice: e.target.value})} />
                    </div>
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-400 mb-1.5 uppercase tracking-widest pl-1">Ongkos Kirim + Jastip</label>
                    <div className="relative">
                      <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold">Rp</span>
                      <input required type="number" min="0" placeholder="0" 
                        className="w-full bg-slate-50 border border-slate-200 pl-12 pr-4 py-3.5 rounded-2xl font-black text-lg outline-none focus:ring-2 focus:ring-slate-800 transition-all placeholder:font-medium" 
                        value={costInput.serviceFee} onChange={(e) => setCostInput({...costInput, serviceFee: e.target.value})} />
                    </div>
                  </div>
                  
                  <div className="pt-2">
                    <button type="submit" className="w-full py-4 bg-slate-800 text-white rounded-2xl font-bold flex justify-center items-center gap-2 active:scale-95 transition shadow-lg">
                      Lanjut Lihat Nota <Icon name="arrow-right" className="w-4 h-4"/>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
