<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#10b981" />
  <title>TitipDong! - Jastip Lokal</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857', 900: '#064e3b' } },
          animation: {
            'fade-in-up': 'fadeInUp 0.3s ease-out forwards',
            'fade-in': 'fadeIn 0.2s ease-out forwards',
            'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
            'spin-slow': 'spin 1.5s linear infinite',
          },
          keyframes: {
            fadeInUp: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            pop: { '0%': { opacity: '0', transform: 'scale(0.9)' }, '100%': { opacity: '1', transform: 'scale(1)' } }
          }
        }
      }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; background-color: #e2e8f0; }
    #app-container { max-width: 480px; margin: 0 auto; background-color: #f8fafc; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); position: relative; }
    ::-webkit-scrollbar { width: 0px; background: transparent; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // ⚙️ KONFIGURASI DATABASE & ADMIN
    // ==========================================
    // 1. Paste URL Google Apps Script di sini:
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxaaxuAXOzjnvc8X3dCnkIop9AzV704YwKMowfs-dn_WUxPW2kUIeLOCJhJlzzQ7h0P/exec"; 
    
    // 2. PIN untuk masuk mode Admin
    const PIN_ADMIN = "123456";
    // ==========================================

    // --- KOMPONEN ICON ANTI-CRASH ---
    const Icon = ({ name, className = "" }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (iconRef.current && window.lucide) {
          iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({ root: iconRef.current });
        }
      }, [name, className]);
      return <span ref={iconRef} className="inline-flex items-center justify-center shrink-0"></span>;
    };

    const formatRupiah = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number || 0);
    const generateId = () => `ORD-${Math.floor(Math.random() * 10000).toString().padStart(4, '0')}`;

    const App = () => {

      // --- DETEKSI MODE URL ---
      const urlParams = new URLSearchParams(window.location.search);
      const adminWaFromUrl = urlParams.get('admin');
      const isCustomerView = !!adminWaFromUrl;

      // --- STATES ---
      const [isAdminMode, setIsAdminMode] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      
      const [orders, setOrders] = useState([]);
      
      const [alertData, setAlertData] = useState({ isOpen: false, message: '', title: '' });
      const [confirmData, setConfirmData] = useState({ isOpen: false, message: '', onConfirm: null });

      const showAlert = (message, title = 'Informasi') => setAlertData({ isOpen: true, message, title });
      const showConfirm = (message, onConfirm) => setConfirmData({ isOpen: true, message, onConfirm });

      // --- PENGATURAN WA ADMIN ---
      const [adminWaNumber, setAdminWaNumber] = useState(() => {
        if (isCustomerView) return adminWaFromUrl;
        return localStorage.getItem('jastip_admin_wa') || "";
      });
      const [isSettingOpen, setIsSettingOpen] = useState(false);
      const [tempWaNumber, setTempWaNumber] = useState(adminWaNumber);

      // --- STATE CUSTOMER PREVIEW ---
      const [formData, setFormData] = useState({ name: '', address: '', request: '' });
      const [customerPreviewData, setCustomerPreviewData] = useState(null);

      // --- STATE ADMIN PREVIEW NOTA ---
      const [isCostModalOpen, setIsCostModalOpen] = useState(false);
      const [selectedOrder, setSelectedOrder] = useState(null);
      const [costInput, setCostInput] = useState({ estimatedItemPrice: '', serviceFee: '' });
      const [adminPreviewData, setAdminPreviewData] = useState(null);


      // --- FUNGSI DATABASE (API) ---
      const fetchOrders = async () => {
        setIsLoading(true);
        try {
          const res = await fetch(GOOGLE_SCRIPT_URL);
          const data = await res.json();
          setOrders(data);
        } catch (error) {
          showAlert("Gagal mengambil data dari server.", "Koneksi Error");
        }
        setIsLoading(false);
      };

      useEffect(() => {
        if (isAdminMode) fetchOrders();
      }, [isAdminMode]);


      // ==========================================
      // ALUR PELANGGAN: INPUT -> PREVIEW -> KIRIM WA
      // ==========================================
      
      // 1. Tampilkan Preview Pesanan Pelanggan
      const handleCustomerPreview = (e) => {
        e.preventDefault();
        if (GOOGLE_SCRIPT_URL.includes("PASTE_URL")) {
          return showAlert("Aplikasi belum di-setup oleh admin.", "Error Sistem");
        }
        if (!adminWaNumber) {
          return showAlert("Error: Link toko tidak valid.", "Error Sistem");
        }
        if (!formData.name || !formData.address || !formData.request) return;

        setCustomerPreviewData({
          id: generateId(),
          ...formData
        });
      };

      // 2. Kirim Pesanan ke DB & Buka WA
      const submitCustomerOrder = async () => {
        setIsLoading(true);
        const newOrder = {
          id: customerPreviewData.id,
          customerName: customerPreviewData.name,
          address: customerPreviewData.address,
          request: customerPreviewData.request,
          status: "MENUNGGU",
          estimatedItemPrice: 0,
          serviceFee: 0,
          date: new Date().toLocaleDateString('id-ID')
        };

        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'create', ...newOrder })
          });

          let message = `*PESANAN BARU - TITIP DONG!* 🛵💨\n\n`;
          message += `*ID:* ${newOrder.id}\n`;
          message += `*Nama:* ${newOrder.customerName}\n`;
          message += `*Alamat:* ${newOrder.address}\n\n`;
          message += `*🛍️ PESANAN:*\n${newOrder.request}\n\n`;
          message += `Mohon info estimasi biayanya ya min.`;

          setFormData({ name: '', address: '', request: '' });
          setCustomerPreviewData(null);
          
          // Redirect langsung ke WA (tanpa popup blocker)
          window.location.href = `https://wa.me/${adminWaNumber}?text=${encodeURIComponent(message)}`;

        } catch (error) {
          showAlert("Gagal mengirim pesanan. Silakan coba lagi.", "Error Jaringan");
        }
        setIsLoading(false);
      };


      // ==========================================
      // ALUR ADMIN: INPUT -> PREVIEW NOTA -> KIRIM WA
      // ==========================================
      
      const handlePinSubmit = (e) => {
        e.preventDefault();
        if (pinInput === PIN_ADMIN) {
          setPinInput('');
          if (!adminWaNumber) {
             setTempWaNumber('');
             setIsSettingOpen(true);
          } else {
             setIsAdminMode(true);
          }
        } else {
          showAlert("PIN yang Anda masukkan salah.", "Akses Ditolak");
          setPinInput('');
        }
      };

      const handleSaveWaNumber = (e) => {
        e.preventDefault();
        let cleanedNumber = tempWaNumber.replace(/[^0-9]/g, '');
        if (cleanedNumber.startsWith('0')) cleanedNumber = '62' + cleanedNumber.substring(1);
        if (cleanedNumber.length < 10) return showAlert('Nomor WA tidak valid!', 'Peringatan');

        setAdminWaNumber(cleanedNumber);
        localStorage.setItem('jastip_admin_wa', cleanedNumber);
        setIsSettingOpen(false);
        setIsAdminMode(true);
        showAlert("Nomor WA berhasil disimpan.", "Berhasil");
      };

      const copyToClipboard = () => {
        const link = `https://${window.location.hostname}/?admin=${adminWaNumber}`;
        const textArea = document.createElement("textarea");
        textArea.value = link;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showAlert("Link Toko berhasil disalin! Bagikan ke Bio Instagram atau WhatsApp pelanggan.", "Berhasil Disalin");
        } catch (err) {
          showAlert("Gagal menyalin link.");
        }
        document.body.removeChild(textArea);
      };

      const openCostModal = (order) => {
        setSelectedOrder(order);
        setCostInput({ estimatedItemPrice: order.estimatedItemPrice || '', serviceFee: order.serviceFee || '' });
        setIsCostModalOpen(true);
      };

      // 1. Tampilkan Preview Nota Admin
      const handleAdminPreview = (e) => {
        e.preventDefault();
        if (!selectedOrder) return;

        const estPrice = parseInt(costInput.estimatedItemPrice) || 0;
        const srvFee = parseInt(costInput.serviceFee) || 0;
        const totalTagihan = estPrice + srvFee;

        let notaMsg = `*NOTA TAGIHAN - TITIP DONG!* 🧾\n\n`;
        notaMsg += `Halo kak *${selectedOrder.customerName}*,\n`;
        notaMsg += `Pesanan kakak (*${selectedOrder.id}*) sedang diproses.\n\n`;
        notaMsg += `*RINCIAN BIAYA:*\n`;
        notaMsg += `Harga Barang : ${formatRupiah(estPrice)}\n`;
        notaMsg += `Ongkir & Jastip : ${formatRupiah(srvFee)}\n`;
        notaMsg += `*TOTAL TAGIHAN : ${formatRupiah(totalTagihan)}*\n\n`;
        notaMsg += `Mohon balas *OKE* jika setuju agar kurir langsung jalan! 🛵💨`;

        setAdminPreviewData({
          order: selectedOrder,
          estPrice,
          srvFee,
          totalTagihan,
          notaMsg
        });

        setIsCostModalOpen(false); // Tutup form input
      };

      // 2. Simpan Harga ke DB & Buka WA Send To
      const submitAdminNota = async () => {
        if (!adminPreviewData) return;
        setIsLoading(true);

        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ 
              action: 'update', 
              id: adminPreviewData.order.id,
              status: "DIPROSES",
              estimatedItemPrice: adminPreviewData.estPrice,
              serviceFee: adminPreviewData.srvFee
            })
          });

          setOrders(orders.map(order => 
            order.id === adminPreviewData.order.id 
              ? { ...order, estimatedItemPrice: adminPreviewData.estPrice, serviceFee: adminPreviewData.srvFee, status: "DIPROSES" } 
              : order
          ));
          
          const notaUrl = `https://wa.me/?text=${encodeURIComponent(adminPreviewData.notaMsg)}`;
          setAdminPreviewData(null);
          setSelectedOrder(null);
          
          // Menggunakan redirect untuk menghindari blokir popup
          window.location.href = notaUrl;

        } catch (error) {
          showAlert("Gagal menyimpan harga ke server.", "Error");
        }
        setIsLoading(false);
      };

      const handleCompleteOrder = async (id) => {
        setIsLoading(true);
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'update', id: id, status: "SELESAI" })
          });
          setOrders(orders.map(o => o.id === id ? { ...o, status: "SELESAI" } : o));
        } catch (e) {
          showAlert("Gagal mengupdate status.", "Error");
        }
        setIsLoading(false);
      };

      const handleDeleteOrder = (id) => {
        showConfirm("Hapus pesanan ini secara permanen dari Database?", async () => {
          setIsLoading(true);
          try {
            await fetch(GOOGLE_SCRIPT_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'delete', id: id })
            });
            setOrders(orders.filter(o => o.id !== id));
          } catch (e) {
            showAlert("Gagal menghapus data.", "Error");
          }
          setIsLoading(false);
        });
      };

      const pesananSelesai = orders.filter(o => o.status === "SELESAI");
      const totalPendapatan = pesananSelesai.reduce((sum, o) => sum + (parseInt(o.serviceFee)||0), 0);
      const totalPesananAktif = orders.filter(o => o.status !== "SELESAI").length;


      // ==========================================
      // UI RENDER
      // ==========================================
      return (
        <div id="app-container" className="flex flex-col relative overflow-x-hidden">
          
          {isLoading && (
            <div className="absolute inset-0 z- bg-white/80 backdrop-blur-sm flex flex-col justify-center items-center">
              <Icon name="loader-2" className="w-10 h-10 text-brand-600 animate-spin-slow mb-2" />
              <p className="text-brand-800 font-bold text-sm">Memproses...</p>
            </div>
          )}

          <header className="bg-brand-600 text-white shadow-md sticky top-0 z-30">
            <div className="px-5 py-4 flex justify-between items-center">
              <div className="flex items-center gap-2">
                <div className="bg-white p-1.5 rounded-lg text-brand-600 shadow-sm"><Icon name="package" className="w-5 h-5" /></div>
                <h1 className="text-xl font-extrabold tracking-tight">TitipDong</h1>
              </div>
              {!isCustomerView && isAdminMode && (
                <button onClick={() => setIsAdminMode(false)} className="p-2 bg-brand-700/50 hover:bg-brand-700 rounded-full transition shadow-inner" title="Keluar">
                  <Icon name="log-out" className="w-5 h-5"/>
                </button>
              )}
            </div>
          </header>

          <main className="flex-1 px-5 py-6 pb-24">
            
            {isCustomerView ? (
              // ==========================================
              // TAMPILAN PELANGGAN
              // ==========================================
              <div className="animate-fade-in-up">
                <div className="mb-6">
                  <h2 className="text-2xl font-black text-slate-800 leading-tight">Pesan<br/>Jastip Sekarang.</h2>
                  <p className="text-sm text-slate-500 mt-2">Isi form pesanan untuk dikirim ke Kurir.</p>
                </div>

                <form onSubmit={handleCustomerPreview} className="space-y-4">
                  <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider">Nama Anda</label>
                      <input required type="text" placeholder="Cth: Budi Santoso" 
                        className="w-full bg-slate-50 border border-slate-200 px-4 py-3.5 rounded-2xl focus:ring-2 focus:ring-brand-500 outline-none font-medium transition-all" 
                        value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider">Alamat Pengantaran</label>
                      <textarea required rows="2" placeholder="Detail alamat..." 
                        className="w-full bg-slate-50 border border-slate-200 px-4 py-3.5 rounded-2xl focus:ring-2 focus:ring-brand-500 outline-none font-medium transition-all resize-none" 
                        value={formData.address} onChange={(e) => setFormData({...formData, address: e.target.value})}></textarea>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider">Daftar Titipan / Pesanan</label>
                      <textarea required rows="3" placeholder="Sebutkan barang dan tokonya..." 
                        className="w-full bg-slate-50 border border-slate-200 px-4 py-3.5 rounded-2xl focus:ring-2 focus:ring-brand-500 outline-none font-medium transition-all resize-none" 
                        value={formData.request} onChange={(e) => setFormData({...formData, request: e.target.value})}></textarea>
                    </div>
                  </div>
                  
                  <button type="submit" className="w-full mt-4 bg-brand-600 text-white py-4 rounded-2xl font-bold flex justify-center items-center gap-2 hover:bg-brand-700 transition shadow-md text-lg">
                    Preview Pesanan <Icon name="eye" className="w-5 h-5" />
                  </button>
                </form>
              </div>

            ) : !isAdminMode ? (
              // HOMEPAGE ADMIN (FORM LOGIN PIN)
              <div className="animate-fade-in-up max-w-sm mx-auto mt-10">
                <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden p-6 relative">
                  <div className="w-16 h-16 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <Icon name="lock" className="w-8 h-8"/>
                  </div>
                  <h3 className="font-bold text-center text-xl mb-1 text-slate-800">Akses Admin</h3>
                  <p className="text-xs text-center text-slate-500 mb-6">Masukkan PIN Keamanan Anda.</p>
                  
                  <form onSubmit={handlePinSubmit}>
                    <input type="password" autoFocus maxLength={6} placeholder="••••••" 
                      className="w-full text-center tracking-[0.5em] text-3xl font-black bg-slate-50 border border-slate-200 px-4 py-4 rounded-2xl mb-4 focus:ring-2 focus:ring-brand-500 outline-none transition-all" 
                      value={pinInput} onChange={(e) => setPinInput(e.target.value)} />
                    <button type="submit" className="w-full py-4 bg-slate-800 text-white rounded-2xl font-bold active:bg-slate-900 transition shadow-md text-lg">Masuk</button>
                  </form>
                </div>
              </div>

            ) : (
              // ==========================================
              // TAMPILAN ADMIN
              // ==========================================
              <div className="animate-fade-in-up">
                
                <div className="bg-slate-800 text-white rounded-3xl p-5 mb-6 shadow-lg relative overflow-hidden">
                  <div className="absolute right-0 top-0 opacity-10 scale-150 transform translate-x-4 -translate-y-4"><Icon name="share-2" className="w-32 h-32" /></div>
                  <h3 className="font-bold text-sm mb-1 text-slate-300 uppercase tracking-wide">Link Toko Anda</h3>
                  <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 mt-2 mb-3 overflow-hidden text-ellipsis whitespace-nowrap text-xs font-mono text-brand-300">
                    {`https://${window.location.hostname}/?admin=${adminWaNumber}`}
                  </div>
                  <button onClick={copyToClipboard} className="w-full py-2.5 bg-brand-500 hover:bg-brand-600 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition">
                    <Icon name="copy" className="w-4 h-4"/> Salin Link Pelanggan
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-3 mb-6">
                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center">
                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wide mb-1 z-10">Omset Bersih (Selesai)</p>
                    <h3 className="text-xl font-black text-brand-600 z-10">{formatRupiah(totalPendapatan)}</h3>
                  </div>
                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center">
                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wide mb-1">Status Database</p>
                    <div className="flex items-baseline gap-1.5">
                      <span className="text-xl font-black text-slate-800">{totalPesananAktif}</span><span className="text-[10px] text-slate-500">Aktif</span>
                      <span className="text-slate-300 mx-0.5">•</span>
                      <span className="text-xl font-black text-slate-800">{pesananSelesai.length}</span><span className="text-[10px] text-slate-500">Selesai</span>
                    </div>
                  </div>
                </div>

                <div className="flex justify-between items-center mb-3">
                  <h3 className="font-bold text-slate-800 flex items-center gap-2"><Icon name="database" className="w-5 h-5 text-brand-600"/> Data Pesanan</h3>
                  <button onClick={fetchOrders} className="text-xs bg-brand-100 text-brand-700 px-3 py-1.5 rounded-full font-bold hover:bg-brand-200 flex items-center gap-1">
                    <Icon name="refresh-cw" className="w-3 h-3"/> Muat Ulang
                  </button>
                </div>

                <div className="space-y-4">
                  {orders.map((order) => (
                    <div key={order.id} className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                      <div className="px-5 py-3 border-b flex justify-between items-center bg-slate-50/50">
                        <span className={`text-[10px] font-bold px-2 py-1 rounded-md uppercase tracking-wide ${order.status === 'MENUNGGU' ? 'bg-amber-100 text-amber-700' : order.status === 'DIPROSES' ? 'bg-brand-100 text-brand-700' : 'bg-slate-200 text-slate-500'}`}>
                          {order.status}
                        </span>
                        <span className="text-[10px] font-mono text-slate-400">{order.date}</span>
                      </div>
                      
                      <div className="p-5">
                        <h3 className="font-bold text-slate-800 text-lg mb-1">{order.customerName}</h3>
                        <p className="text-xs font-medium text-slate-500 mb-4 flex items-start gap-1"><Icon name="map-pin" className="w-3.5 h-3.5 shrink-0 mt-0.5" />{order.address}</p>
                        
                        <div className="bg-slate-50 border border-slate-100 p-3.5 rounded-2xl text-sm text-slate-700 whitespace-pre-wrap shadow-inner">
                          {order.request}
                        </div>
                        
                        {(order.status === 'DIPROSES' || order.status === 'SELESAI') && (
                          <div className="mt-4 pt-4 border-t border-dashed border-slate-200 space-y-1">
                             <div className="flex justify-between text-xs text-slate-500">
                                <span>Estimasi Barang</span><span>{formatRupiah(order.estimatedItemPrice)}</span>
                             </div>
                             <div className="flex justify-between text-xs text-brand-600 font-bold">
                                <span>Ongkir + Jastip</span><span>{formatRupiah(order.serviceFee)}</span>
                             </div>
                          </div>
                        )}
                      </div>

                      <div className="p-3 bg-slate-50/80 border-t flex gap-2">
                        {order.status === 'MENUNGGU' && (
                          <button onClick={() => openCostModal(order)} className="flex-1 bg-brand-600 text-white py-3 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-brand-700 transition">
                            <Icon name="calculator" className="w-4 h-4"/> Input Harga & Nota
                          </button>
                        )}
                        {order.status === 'DIPROSES' && (
                          <button onClick={() => handleCompleteOrder(order.id)} className="flex-1 bg-slate-800 text-white py-3 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-slate-900 transition">
                            <Icon name="check-circle" className="w-4 h-4"/> Tandai Selesai
                          </button>
                        )}
                        <button onClick={() => handleDeleteOrder(order.id)} className="w-12 bg-white text-slate-400 hover:text-red-500 border rounded-xl flex items-center justify-center transition" title="Hapus">
                          <Icon name="trash-2" className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                  ))}
                  {orders.length === 0 && !isLoading && (
                    <div className="text-center py-12">
                      <div className="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mb-3 border text-slate-300"><Icon name="inbox" className="w-8 h-8" /></div>
                      <p className="text-sm font-bold text-slate-400">Database Kosong.</p>
                      <p className="text-xs text-slate-400">Klik 'Muat Ulang' jika ada pesanan baru.</p>
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>


          {/* ==========================================
              MODAL PREVIEW PELANGGAN
          ========================================== */}
          {customerPreviewData && (
            <div className="fixed inset-0 z- flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm animate-fade-in p-0 sm:p-5">
              <div className="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full max-w-sm p-6 pb-8 sm:pb-6 animate-fade-in-up">
                <div className="flex items-center justify-center w-12 h-12 bg-brand-100 text-brand-600 rounded-full mx-auto mb-4">
                  <Icon name="file-text" className="w-6 h-6"/>
                </div>
                <h3 className="font-bold text-center text-xl text-slate-800 mb-1">Preview Pesanan</h3>
                <p className="text-xs text-center text-slate-500 mb-5">Pastikan pesanan Anda sudah benar.</p>
                
                <div className="bg-slate-50 border border-slate-100 rounded-2xl p-4 mb-6 space-y-3">
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wide">Nama / Alamat</span>
                    <p className="text-sm font-bold text-slate-800">{customerPreviewData.name}</p>
                    <p className="text-xs text-slate-600 leading-snug mt-0.5">{customerPreviewData.address}</p>
                  </div>
                  <div className="pt-3 border-t border-slate-200">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wide">Daftar Titipan</span>
                    <p className="text-sm text-slate-700 whitespace-pre-wrap mt-1 font-medium">{customerPreviewData.request}</p>
                  </div>
                </div>

                <div className="flex gap-2">
                  <button onClick={() => setCustomerPreviewData(null)} className="flex-1 py-3.5 bg-slate-100 text-slate-600 font-bold rounded-2xl">Edit Kembali</button>
                  <button onClick={submitCustomerOrder} className="flex- py-3.5 bg-brand-600 text-white font-bold rounded-2xl flex justify-center items-center gap-2 active:scale-95 transition">
                    Kirim ke WA <Icon name="send" className="w-4 h-4"/>
                  </button>
                </div>
              </div>
            </div>
          )}


          {/* ==========================================
              MODAL PREVIEW NOTA ADMIN
          ========================================== */}
          {adminPreviewData && (
            <div className="fixed inset-0 z- flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm animate-fade-in p-0 sm:p-5">
              <div className="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full max-w-sm p-6 pb-8 sm:pb-6 animate-fade-in-up border-t-8 border-brand-500 relative">
                <div className="absolute top-0 right-6 w-8 h-10 bg-brand-500 shadow-sm rounded-b flex items-end justify-center pb-2">
                  <Icon name="receipt" className="w-4 h-4 text-white"/>
                </div>
                
                <h3 className="font-bold text-xl text-slate-800 mt-2 mb-1">Preview Nota</h3>
                <p className="text-xs font-medium text-slate-500 mb-5">Pesanan: {adminPreviewData.order.customerName}</p>

                <div className="bg-brand-50/50 border border-brand-100 rounded-2xl p-4 mb-6">
                  <div className="space-y-2 text-sm">
                    <div className="flex justify-between text-slate-600 font-medium">
                      <span>Harga Barang</span><span>{formatRupiah(adminPreviewData.estPrice)}</span>
                    </div>
                    <div className="flex justify-between text-slate-600 font-medium">
                      <span>Ongkir & Jastip</span><span>{formatRupiah(adminPreviewData.srvFee)}</span>
                    </div>
                  </div>
                  <div className="mt-3 pt-3 border-t border-brand-200 border-dashed flex justify-between items-center">
                    <span className="text-xs font-bold text-slate-500 uppercase tracking-wide">Total Tagihan</span>
                    <span className="font-black text-xl text-brand-600">{formatRupiah(adminPreviewData.totalTagihan)}</span>
                  </div>
                </div>

                <div className="flex gap-2">
                  <button onClick={() => { setAdminPreviewData(null); setIsCostModalOpen(true); }} className="flex-1 py-3.5 bg-slate-100 text-slate-600 font-bold rounded-2xl">Edit Biaya</button>
                  <button onClick={submitAdminNota} className="flex- py-3.5 bg-brand-600 text-white font-bold rounded-2xl flex justify-center items-center gap-2 active:scale-95 transition shadow-md">
                    Kirim WA <Icon name="share" className="w-4 h-4"/>
                  </button>
                </div>
                <p className="text-[10px] text-center text-slate-400 mt-3">Membuka WA Send To. Pilih kontak pelanggan Anda.</p>
              </div>
            </div>
          )}


          {/* ==========================================
              MODAL LAINNYA (Alert, Confirm, Setup, Cost)
          ========================================== */}
          
          {/* Custom Alert */}
          {alertData.isOpen && (
            <div className="fixed inset-0 z- flex items-center justify-center p-5 bg-slate-900/40 backdrop-blur-sm animate-fade-in">
              <div className="bg-white rounded-3xl w-full max-w-xs p-6 shadow-2xl animate-pop text-center">
                <h3 className="font-bold text-lg text-slate-800 mb-2">{alertData.title}</h3>
                <p className="text-sm text-slate-600 mb-6 leading-relaxed">{alertData.message}</p>
                <button onClick={() => setAlertData({...alertData, isOpen: false})} className="w-full py-3 bg-brand-600 text-white font-bold rounded-xl active:bg-brand-700">Tutup</button>
              </div>
            </div>
          )}

          {/* Custom Confirm */}
          {confirmData.isOpen && (
            <div className="fixed inset-0 z-[300] flex items-center justify-center p-5 bg-slate-900/40 backdrop-blur-sm animate-fade-in">
              <div className="bg-white rounded-3xl w-full max-w-xs p-6 shadow-2xl animate-pop text-center">
                <h3 className="font-bold text-lg text-slate-800 mb-2">Konfirmasi</h3>
                <p className="text-sm text-slate-600 mb-6 leading-relaxed">{confirmData.message}</p>
                <div className="flex gap-2">
                  <button onClick={() => setConfirmData({...confirmData, isOpen: false})} className="flex-1 py-3 bg-slate-100 text-slate-700 font-bold rounded-xl active:bg-slate-200">Batal</button>
                  <button onClick={() => { confirmData.onConfirm(); setConfirmData({...confirmData, isOpen: false}); }} className="flex-1 py-3 bg-red-500 text-white font-bold rounded-xl active:bg-red-600">Ya, Lanjutkan</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Setup WA Admin */}
          {isSettingOpen && (
            <div className="fixed inset-0 z-[250] flex items-end sm:items-center justify-center bg-slate-900/80 backdrop-blur-sm animate-fade-in p-0 sm:p-5">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-xs p-6 animate-pop relative">
                <button onClick={() => setIsPinModalOpen(false)} className="absolute right-4 top-4 text-slate-400"><Icon name="x" className="w-5 h-5"/></button>
                <div className="w-12 h-12 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center mx-auto mb-3"><Icon name="lock" className="w-6 h-6"/></div>
                <h3 className="font-bold text-center text-lg mb-1 text-slate-800">Akses Admin</h3>
                <p className="text-xs text-center text-slate-500 mb-5">Masukkan PIN Keamanan (123456)</p>
                
                <form onSubmit={handlePinSubmit}>
                  <input type="password" autoFocus maxLength={6} placeholder="••••••" 
                    className="w-full text-center tracking-[0.5em] text-2xl font-black bg-slate-50 border px-4 py-3.5 rounded-2xl mb-2 focus:ring-2 focus:ring-brand-500 outline-none" 
                    value={pinInput} onChange={(e) => setPinInput(e.target.value)} />
                  <button type="submit" className="w-full mt-2 py-3.5 bg-slate-800 text-white rounded-2xl font-bold active:bg-slate-900 transition">Masuk</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Setup WA Admin */}
          {isSettingOpen && (
            <div className="fixed inset-0 z- flex items-end sm:items-center justify-center bg-slate-900/80 backdrop-blur-sm animate-fade-in p-0 sm:p-5">
              <div className="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden p-6 pb-10 sm:pb-6 animate-fade-in-up">
                <h3 className="font-bold text-xl text-slate-800 mb-1">Pengaturan Awal</h3>
                <p className="text-xs font-medium text-slate-500 mb-5">Silakan atur nomor WhatsApp Anda. Sistem akan membuat Link Toko berdasarkan nomor ini.</p>
                <form onSubmit={handleSaveWaNumber}>
                  <div className="relative mb-5">
                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold"><Icon name="phone" className="w-5 h-5"/></span>
                    <input type="tel" placeholder="Contoh: 08123456789" required
                      className="w-full bg-slate-50 border border-slate-200 pl-12 pr-4 py-3.5 rounded-2xl focus:ring-2 focus:ring-brand-500 focus:bg-white outline-none font-bold tracking-wide transition-all"
                      value={tempWaNumber} onChange={(e) => setTempWaNumber(e.target.value)} />
                  </div>
                  <button type="submit" className="w-full py-3.5 bg-brand-600 text-white font-bold rounded-2xl shadow-md active:bg-brand-700 transition">Simpan & Buka Dashboard</button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Input Biaya (Admin) - Sebelum Preview */}
          {isCostModalOpen && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm animate-fade-in p-0 sm:p-5">
              <div className="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full max-w-sm p-6 pb-10 sm:pb-6 animate-fade-in-up">
                <div className="flex justify-between items-center mb-5">
                  <h3 className="font-bold text-xl text-slate-800">Input Biaya Tagihan</h3>
                  <button onClick={() => setIsCostModalOpen(false)} className="bg-slate-100 text-slate-500 p-1.5 rounded-full"><Icon name="x" className="w-4 h-4"/></button>
                </div>
                <form onSubmit={handleAdminPreview} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Harga Barang (Estimasi)</label>
                    <div className="relative">
                      <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold">Rp</span>
                      <input required type="number" min="0" placeholder="0" className="w-full bg-slate-50 border border-slate-200 pl-11 pr-4 py-3.5 rounded-2xl font-black outline-none focus:ring-2 focus:ring-brand-500" value={costInput.estimatedItemPrice} onChange={(e) => setCostInput({...costInput, estimatedItemPrice: e.target.value})} />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Ongkos Kirim + Jastip</label>
                    <div className="relative">
                      <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold">Rp</span>
                      <input required type="number" min="0" placeholder="0" className="w-full bg-slate-50 border border-slate-200 pl-11 pr-4 py-3.5 rounded-2xl font-black outline-none focus:ring-2 focus:ring-brand-500" value={costInput.serviceFee} onChange={(e) => setCostInput({...costInput, serviceFee: e.target.value})} />
                    </div>
                  </div>
                  
                  <button type="submit" className="w-full mt-4 py-4 bg-slate-800 text-white rounded-2xl font-bold flex justify-center items-center gap-2 active:scale-95 transition">
                    Simpan & Lihat Preview Nota <Icon name="eye" className="w-4 h-4"/>
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
